        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }

        }

        const modalMessage = document.getElementById('modal-message');
        const modalClose = document.getElementById('modal-close');

        const resetBtn = document.getElementById('reset-btn');
        const passwordModal = document.getElementById('password-modal');
        const resetPasswordInput = document.getElementById('reset-password-input');
        const passwordSubmit = document.getElementById('password-submit');
        const passwordCancel = document.getElementById('password-cancel');
        const passwordError = document.getElementById('password-error');

        let unsubscribe = null;
        let isSaving = false;

        function showModal(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
        }

        modalClose.addEventListener('click', () => modal.classList.add('hidden'));

        // Reset Logic
        resetBtn.addEventListener('click', () => {
            resetPasswordInput.value = '';
            passwordError.classList.add('hidden');
            passwordModal.classList.remove('hidden');
            setTimeout(() => resetPasswordInput.focus(), 100);
        });

        passwordCancel.addEventListener('click', () => {
            passwordModal.classList.add('hidden');
        });

        resetPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') passwordSubmit.click();
        });

        passwordSubmit.addEventListener('click', async () => {
            if (resetPasswordInput.value === 'dltnals') {
                passwordSubmit.disabled = true;
                passwordSubmit.textContent = '삭제 중...';
                try {
                    const feedbacksRef = collection(db, 'feedbacks');
                    const querySnapshot = await getDocs(feedbacksRef);
                    const batch = writeBatch(db);
                    
                    querySnapshot.forEach((document) => {
                        batch.delete(doc(db, 'feedbacks', document.id));
                    });
                    
                    await batch.commit();
                    passwordModal.classList.add('hidden');
                    showModal('초기화 완료', '모든 질문 목록이 성공적으로 삭제되었습니다.');
                } catch (error) {
                    console.error("Error clearing documents: ", error);
                    showModal('오류', '데이터를 삭제하는 중 오류가 발생했습니다. 권한을 확인해주세요.');
                } finally {
                    passwordSubmit.disabled = false;
                    passwordSubmit.textContent = '삭제';
                }
            } else {
                passwordError.classList.remove('hidden');
                resetPasswordInput.select();
            }
        });

        function populateSelect(selectElem, dataArray) {
            selectElem.innerHTML = `<option value="">-- 선택하세요 --</option>`;
            dataArray.forEach(val => {
                const option = document.createElement('option');
                option.value = val;
                option.textContent = val;
                selectElem.appendChild(option);
            });
        }

        // 1. 학습 사이트 선택
        categorySelect.addEventListener('change', (e) => {
            const selectedCategoryId = e.target.value;

            // Reset Sub Dropdowns & Description
            itemSelectContainer.classList.add('hidden');
            subItemSelectContainer.classList.add('hidden');
            detailItemSelectContainer.classList.add('hidden');
            descriptionContainer.classList.add('hidden');
            descriptionInput.value = '';
            itemSelect.innerHTML = '';
            subItemSelect.innerHTML = '';
            detailItemSelect.innerHTML = '';
            submitBtn.disabled = true;

            // Populate Item Select (Level 2)
            if (selectedCategoryId && categoryData[selectedCategoryId]) {
                const items = categoryData[selectedCategoryId].items;
                itemSelectContainer.classList.remove('hidden');
                
                if (Array.isArray(items)) {
                    populateSelect(itemSelect, items); // Direct array (mirae3)
                } else {
                    populateSelect(itemSelect, Object.keys(items)); // Object keys (python2, bank3, cbt)
                }
            }
        });

        // 2. 세부 항목 선택
        itemSelect.addEventListener('change', (e) => {
            const categoryId = categorySelect.value;
            const selectedItem = e.target.value;
            
            subItemSelectContainer.classList.add('hidden');
            detailItemSelectContainer.classList.add('hidden');
            descriptionContainer.classList.add('hidden');
            subItemSelect.innerHTML = '';
            detailItemSelect.innerHTML = '';
            submitBtn.disabled = true;

            if (selectedItem) {
                const items = categoryData[categoryId].items;
                if (!Array.isArray(items) && items[selectedItem]) {
                    // Level 3 exists
                    const subItems = items[selectedItem];
                    subItemSelectContainer.classList.remove('hidden');
                    
                    if (Array.isArray(subItems)) {
                        populateSelect(subItemSelect, subItems); // End at level 3
                    } else {
                        populateSelect(subItemSelect, Object.keys(subItems)); // Object keys (need level 4)
                    }
                } else {
                    // Level 2 is the end
                    submitBtn.disabled = false;
                    descriptionContainer.classList.remove('hidden');
                }
            }
        });

        // 3. 하위 항목 선택
        subItemSelect.addEventListener('change', (e) => {
            const categoryId = categorySelect.value;
            const selectedItem = itemSelect.value;
            const selectedSubItem = e.target.value;
            
            detailItemSelectContainer.classList.add('hidden');
            descriptionContainer.classList.add('hidden');
            detailItemSelect.innerHTML = '';
            submitBtn.disabled = true;

            if (selectedSubItem) {
                const items = categoryData[categoryId].items;
                const subItems = items[selectedItem];
                
                if (!Array.isArray(subItems) && subItems[selectedSubItem]) {
                    // Level 4 exists
                    const detailItems = subItems[selectedSubItem];
                    detailItemSelectContainer.classList.remove('hidden');
                    populateSelect(detailItemSelect, detailItems);
                } else {
                    // Level 3 is the end
                    submitBtn.disabled = false;
                    descriptionContainer.classList.remove('hidden');
                }
            }
        });
        
        // 4. 상세 번호 선택
        detailItemSelect.addEventListener('change', (e) => {
            if (e.target.value) {
                submitBtn.disabled = false;
                descriptionContainer.classList.remove('hidden');
            } else {
                submitBtn.disabled = true;
                descriptionContainer.classList.add('hidden');
            }
        });

        // Handle Submit
        submitBtn.addEventListener('click', async () => {
            if (isSaving) return;
            
            const categoryId = categorySelect.value;
            let itemId = itemSelect.value;
            
            // Build item ID string based on visible dropdowns
            if (!subItemSelectContainer.classList.contains('hidden')) {
                const subItem = subItemSelect.value;
                if (!subItem) return;
                itemId += ` - ${subItem}`; 
            }
            if (!detailItemSelectContainer.classList.contains('hidden')) {
                const detailItem = detailItemSelect.value;
                if (!detailItem) return;
                itemId += ` - ${detailItem}`; 
            }

            if (!categoryId || !itemId) return;
            
            const desc = descriptionInput.value.trim();

            isSaving = true;
            submitBtn.disabled = true;
            submitBtn.textContent = '등록 중...';
            submitBtn.classList.replace('bg-blue-600', 'bg-gray-400');
            submitBtn.classList.remove('hover:bg-blue-700');

            try {
                const categoryName = categoryData[categoryId].name;
                const feedbacksRef = collection(db, 'feedbacks');
                const querySnapshot = await getDocs(feedbacksRef);
                
                let existingDoc = null;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.categoryId === categoryId && data.itemId === itemId) {
                        existingDoc = doc;
                    }
                });

                if (existingDoc) {
                    // Update increment
                    let newComments = existingDoc.data().comments || [];
                    if (desc) newComments.push(desc);
                    
                    await updateDoc(doc(db, 'feedbacks', existingDoc.id), {
                        count: existingDoc.data().count + 1,
                        comments: newComments,
                        updatedAt: serverTimestamp()
                    });
                    showStatus('성공적으로 누적되었습니다!', 'success');
                } else {
                    // Create new
                    await addDoc(feedbacksRef, {
                        categoryId: categoryId,
                        categoryName: categoryName,
                        itemId: itemId,
                        count: 1,
                        comments: desc ? [desc] : [],
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    });
                    showStatus('새로운 질문이 등록되었습니다!', 'success');
                }

                // Reset specific dropdowns, keep category
                itemSelect.value = '';
                subItemSelectContainer.classList.add('hidden');
                detailItemSelectContainer.classList.add('hidden');
                descriptionContainer.classList.add('hidden');
                descriptionInput.value = '';
                submitBtn.disabled = true;
            } catch (error) {
                console.error("Error saving document: ", error);
                showStatus('오류가 발생했습니다.', 'error');
                showModal('저장 오류', '데이터 저장 권한이 없습니다. Firebase Console에서 규칙을 확인하거나 새로고침 해주세요.');
            } finally {
                isSaving = false;
                submitBtn.textContent = '질문 등록하기';
                submitBtn.classList.replace('bg-gray-400', 'bg-blue-600');
                submitBtn.classList.add('hover:bg-blue-700');
            }
        });

        function showStatus(text, type) {
            statusMessage.textContent = text;
            statusMessage.className = `text-sm text-center font-medium block mt-2 ${type === 'success' ? 'text-green-600' : 'text-red-600'} fade-in`;
            setTimeout(() => {
                statusMessage.classList.add('hidden');
                statusMessage.classList.remove('block');
            }, 3000);
        }

        // Real-time listener
        function setupRealtimeListener() {
            if (unsubscribe) unsubscribe();

            const feedbacksRef = collection(db, 'feedbacks');
            
            unsubscribe = onSnapshot(feedbacksRef, (snapshot) => {
                const feedbacks = [];
                snapshot.forEach((doc) => {
                    feedbacks.push({ id: doc.id, ...doc.data() });
                });
                renderTable(feedbacks);
            }, (error) => {
                console.error("Snapshot error: ", error);
                tablesContainer.innerHTML = `<div class="bg-white rounded-lg border border-gray-200 p-8 text-center text-red-500">데이터를 불러오는데 실패했습니다.</div>`;
            });
        }

        function renderTable(data) {
            tablesContainer.innerHTML = '';

            if (data.length === 0) {
                tablesContainer.innerHTML = `<div class="bg-white rounded-lg border border-gray-200 p-8 text-center text-gray-500">아직 등록된 질문이 없습니다.</div>`;
                return;
            }

            // Group data by categoryId
            const grouped = {};
            data.forEach(item => {
                if (!grouped[item.categoryId]) {
                    grouped[item.categoryId] = [];
                }
                grouped[item.categoryId].push(item);
            });

            // Order of categories based on categoryData keys to maintain consistent order
            const categoryOrder = Object.keys(categoryData);

            categoryOrder.forEach(catId => {
                if (grouped[catId] && grouped[catId].length > 0) {
                    // Sort items within this category by count (desc), then date (desc)
                    grouped[catId].sort((a, b) => {
                        if (b.count !== a.count) return b.count - a.count;
                        const timeA = a.updatedAt?.toMillis ? a.updatedAt.toMillis() : 0;
                        const timeB = b.updatedAt?.toMillis ? b.updatedAt.toMillis() : 0;
                        return timeB - timeA; 
                    });

                    // Create category section
                    const section = document.createElement('div');
                    section.className = 'fade-in';
                    
                    const catTitle = document.createElement('h3');
                    catTitle.className = 'text-lg font-bold text-gray-800 mb-3 border-l-4 border-blue-500 pl-3';
                    catTitle.textContent = categoryData[catId].name;
                    section.appendChild(catTitle);

                    const tableWrapper = document.createElement('div');
                    tableWrapper.className = 'overflow-x-auto bg-white rounded-lg border border-gray-200 shadow-sm mb-6';
                    
                    let rowsHtml = '';
                    grouped[catId].forEach(item => {
                        let dateStr = '-';
                        if (item.updatedAt?.toDate) {
                            const date = item.updatedAt.toDate();
                            dateStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                        }

                        const countBadgeClass = item.count >= 5 
                            ? 'bg-red-100 text-red-800 border-red-200' 
                            : (item.count >= 3 ? 'bg-yellow-100 text-yellow-800 border-yellow-200' : 'bg-gray-100 text-gray-800 border-gray-200');

                        let commentsHtml = '<span class="text-gray-400 italic text-xs">없음</span>';
                        if (item.comments && item.comments.length > 0) {
                            commentsHtml = `<ul class="list-disc list-inside space-y-1 text-left text-sm text-gray-700 mt-1">
                                ${item.comments.map(c => `<li>${c.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</li>`).join('')}
                            </ul>`;
                        }

                        rowsHtml += `
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-4 py-4 whitespace-nowrap text-sm font-medium text-gray-900 w-1/4">${item.itemId}</td>
                                <td class="px-4 py-4 whitespace-normal text-sm text-gray-700 w-2/4">${commentsHtml}</td>
                                <td class="px-4 py-4 whitespace-nowrap text-center w-16">
                                    <span class="px-3 py-1 inline-flex text-sm leading-5 font-bold rounded-full border ${countBadgeClass}">
                                        ${item.count}
                                    </span>
                                </td>
                                <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500 text-right w-24">${dateStr}</td>
                            </tr>
                        `;
                    });

                    tableWrapper.innerHTML = `
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">세부 항목</th>
                                    <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">어려운 부분 내용</th>
                                    <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">누적 수</th>
                                    <th scope="col" class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">최근 등록일</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${rowsHtml}
                            </tbody>
                        </table>
                    `;
                    section.appendChild(tableWrapper);
                    tablesContainer.appendChild(section);
                }
            });
        }

        // Initialize App
        async function init() {
            try {
                try {
                    await signInAnonymously(auth);
                } catch (authError) {
                    console.warn("Auth failed:", authError.message);
                    if(authError.code === 'auth/configuration-not-found') {
                        showModal('안내', '현재 Firebase 익명 로그인이 설정되어 있지 않아 테스트 모드로 실행됩니다. 데이터를 저장하려면 설정을 완료해주세요.');
                    }
                }
                setupRealtimeListener();
            } catch (error) {
                console.error("Initialization error: ", error);
                tablesContainer.innerHTML = `<div class="bg-white rounded-lg border border-gray-200 p-8 text-center text-red-500">초기화 중 오류가 발생했습니다.</div>`;
            }
        }

        init();
    </script>
</body>
</html>
